<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 16 16" fill="currentColor">
  <style>
    .eq-bars {
      transform: scale(1, -1) translate(0, -24px);
    }
    .eq-bar {
      transform-box: fill-box;
      transform-origin: top;
    }
    .eq-bar--1 {
      animation: short-eq 0.5s infinite 0s;
    }
    .eq-bar--2 {
      animation: tall-eq 0.5s infinite 0.17s;
    }
    .eq-bar--3 {
      animation: short-eq 0.5s infinite 0.34s;
    }

    @keyframes short-eq {
      0%,
      100% {
        transform: scaleY(1);
      }

      50% {
        transform: scaleY(0.5);
      }
    }
    @keyframes tall-eq {
      0%,
      100% {
        transform: scaleY(1);
      }

      50% {
        transform: scaleY(0.375);
      }
    }
  </style>
  <g class="eq-bars">
    <rect class="eq-bar eq-bar--1" x="4" y="4" width="3.7" height="8"/>
    <rect class="eq-bar eq-bar--2" x="10.2" y="4" width="3.7" height="16"/>
    <rect class="eq-bar eq-bar--3" x="16.3" y="4" width="3.7" height="11"/>
  </g>
</svg>
